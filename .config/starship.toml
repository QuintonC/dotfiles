format = """
[░▒▓](#a3aed2)\
$directory\
[](bg:#769ff0 fg:#a3aed2)\
$git_branch\
[](fg:#769ff0 bg:#394260)\
$git_status\
[](fg:#394260 bg:#1A1B26)\
\n$character"""

[directory]
style = "fg:#090c0c bg:#a3aed2"
format = "[ $path]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "fg:#e3e5e5 bg:#769ff0"
format = '[[ $symbol $branch ($git_commit)]($style)]($style)'

[git_commit]
commit_hash_length = 4
tag_symbol = '🔖 '

[git_status]
style = "fg:#769ff0 bg:#394260"
modified = '✗\($count\)'
format = '[[( $modified)]($style)]($style)'
